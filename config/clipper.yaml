# config/clipper.yaml - Stream Clipper System Configuration
# All tunable parameters are defined here with sane defaults.

# Engine selection: legacy | script (Default stays legacy until user approval)
engine: "legacy"

# Swappable model slot architecture (Rule R2)
hearing:
  stem_splitter: "demucs"       # facebookresearch/demucs (htdemucs)
  vad: "silero"                 # snakers4/silero-vad (v5)
  audio_tagger: "panns"         # qiuqiangkong/audioset_tagging_cnn (CNN14)
  music_mood: "clap"            # laion/clap-htsat-unfused
  diarizer: "speechbrain"       # speechbrain/spkrec-ecapa-voxceleb (or pyannote with HF_TOKEN)
  embedder: "ecapa"             # speechbrain/spkrec-ecapa-voxceleb
  transcriber: "faster-whisper" # Systran/faster-whisper-large-v3-turbo
  emotion: "emotion2vec"        # emotion2vec/emotion2vec_plus_base
  prosody: "dsp"                # Deterministic F0 pitch & RMS loudness dynamics
  llm_narrative: "qwen3:14b"    # Ollama qwen3:14b / qwen2.5:7b

sight:
  face_detector: "yunet"        # OpenCV YuNet (face_detection_yunet_2023mar.onnx)
  face_recognizer: "sface"      # OpenCV SFace (face_recognition_sface_2021dec.onnx)
  person_detector: "rtdetr"     # PekingU/rtdetr_r18vd (Apache 2.0 license-clean)
  scene_detector: "transnetv2"  # TransNetV2 cut/boundary detector ONNX
  ocr: "rapidocr"               # RapidOCR PP-OCRv4 ONNX
  vlm: "qwen3:14b"              # Local VLM via Ollama / API Vision

moments:
  max_clip_length: 360.0        # Hard cap 6 minutes per clip
  max_joined_pieces: 3          # Max 3 disjoint pieces for multi-part setup/payoff joining

audio:
  whisper_model: "large-v3-turbo" # large-v3, large-v3-turbo, distil-large-v3
  vad_filter: true
  whisper_batch_size: 16         # GPU batched transcription (much faster). Set 1 to turn off
  section_padding_seconds: 3.0   # Padding around extracted video clips

signals:
  use_story_hunter: true         # AutoClip/OpenShorts transcript-first sliding windows & 4-pillar ranking
  max_clips_per_hour: 10         # Per-hour maximum quota cap per streamer (max 10 clips/hr)
  hourly_quota_buffer: 3         # Flexible buffer slots (+2 to +3) so high-scoring great moments aren't discarded
  buffer_score_threshold: 6.5    # Minimum virality score required to use a buffer slot beyond base cap
  default_min_clip_length: 30.0  # Hard floor minimum clip length (no clips under 30s; target 60-180s)
  default_max_clip_length: 240.0 # Maximum clip length in seconds (up to 4 minutes for complete scenes & cutscenes)
  pre_peak_lead_seconds: 45.0    # Pre-roll lead time to capture full story buildup & context
  post_peak_trail_seconds: 60.0  # Post-roll trail time to capture full reaction aftermath
  rolling_window_seconds: 600    # 10 minutes baseline window for robust z-score
  merge_gap_seconds: 25          # Merge nearby peak moments within this gap
  max_lead_seconds: 15.0         # Max lead time to snap to sentence boundary
  max_trail_seconds: 25.0        # Max trail time to snap to sentence boundary
  weights:
    chat_rate: 0.25
    chat_keywords: 0.30
    streamer_loudness: 0.20
    speech_energy: 0.15
    youtube_heatmap: 0.10
  z_thresholds:
    Low: 2.5
    Medium: 2.0
    High: 1.5
  default_sensitivity: "Medium"
  safety_max_clips: 50
  dedupe_overlap_threshold: 0.50 # Overlap ratio above which moments are discarded

llm:
  enabled: true
  endpoint: "http://localhost:11434"
  model: "qwen3:14b"             # ~9 GB, fits the 12 GB card fully; best at following the JSON format
  autostart_ollama: true         # Studio starts Ollama in the background when it opens
  keep_alive_seconds: -1         # Keep Qwen resident in VRAM permanently alongside Whisper turbo
  num_ctx: 4096
  candidate_multiplier: 3        # Review top 3x N candidates
  weight_llm: 0.50
  weight_hype: 0.50
  timeout_seconds: 120           # generous timeout for 14B Q4 generation on laptop GPUs
  retry_count: 1

facecam:
  sample_interval_seconds: 0.5   # Sample 2 frames/sec for smooth continuous face tracking
  presence_threshold: 0.30       # Use split/irl layout if face presence >= 30% (robust to active motion)
  box_padding: 1.0               # Expansion around the face (1.0 = webcam-sized: head + shoulders)
  fullscreen_face_ratio: 0.20    # Face taller than this share of the frame => full-screen cam ("irl" layout)
  facecam_max_drift: 0.10        # Normal streamer motion tolerance (~10% frame width drift)
  split_facecam_height: 640      # Height of facecam area in 1080x1920 split layout
  gameplay_blur_background: true # Blur background for gameplay fit-to-width
  gameplay_aspect: "16:9"        # Framed layout: "16:9" = whole picture in the middle band; "4:3"/"1:1" zoom in

polish:
  progress_bar: true             # Thin bar along the bottom that fills as the clip plays
  progress_bar_color: "yellow"
  hook_duration_seconds: 2.5
  punch_zoom:
    enabled: false               # Disabled: keep clips smooth and natural without abrupt crop jumps
    factor: 1.12                 # Subtle punch-zoom (1.10x - 1.15x) on punchline climax
  enhance: "light"               # light denoise + sharpen on every clip ("off" to disable)
  ai_upscale_cams: "auto"        # AI-sharpen small cam crops with Real-ESRGAN when installed (setup_upscaler.ps1); "off" to disable
  ai_upscale_min_factor: 1.15    # AI-sharpen when the cam is enlarged at least this much
  cam_max_upscale: 1.5           # a cam is shown WHOLE and enlarged at most this much (more looks chopped/soft)
  cam_max_upscale_ai: 2.2        # same, when Real-ESRGAN is installed
  ai_upscale_model: "realesrgan-x4plus"
  loudnorm:
    enabled: true
    target_lufs: -14.0
    target_tp: -1.0
    target_lra: 11.0
  silence:
    trim_breath_seconds: 0.3
    remove_internal_dead_air: false # DISABLED: Stream clips are continuous narrative cuts (never chop internal pauses)
    dead_air_min_gap_seconds: 4.0   # Only trim prolonged dead air > 4.0s if explicitly enabled
    dead_air_target_gap_seconds: 1.0

qc:
  min_clip_length: 30.0          # Strict minimum clip length verification (seconds)
  loudness_tolerance_lu: 2.0
  music_silence_words_duration: 8.0

live:
  # Network & Bandwidth Conservation (Cuts 36 GB spend down to ~3-8 GB without losing mobile output quality)
  # Modes:
  #   data_saver:  "720p,720p60,480p,best" (~900 MB/hr, 75% Wi-Fi savings, looks crisp on 9:16 mobile)
  #   ultra_saver: "480p,360p,worst"       (~350 MB/hr, 90% savings for mobile hotspot / metered Wi-Fi)
  #   source:      "1080p60,1080p,best"    (~3.8 GB/hr, maximum uncompressed desktop source)
  data_saver_mode: "data_saver"
  stream_quality: "720p,720p60,480p,best"
  offline_buffer_drain: true        # If stream ends while laptop is off, complete processing the saved buffer on reboot
  preserve_feedback_on_delete: true # Keep AI training ratings & taste memory in ai_feedback.json when deleting heavy video files
